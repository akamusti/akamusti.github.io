<style>
  :root {
    --bg: #0b0d10;
    --fg: #e2e5e8;
    --muted: #8b93a1;
    --dim: #464c56;
    --divider: rgba(255, 255, 255, 0.07);
    --accent: #7ee787;
    --radius: 10px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  ::selection {
    background: rgba(126, 231, 135, 0.25);
    color: var(--fg);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    color: var(--fg);
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 85% 45% at 50% -18%, rgba(126, 231, 135, 0.07), transparent),
      radial-gradient(ellipse 55% 35% at 85% 110%, rgba(126, 231, 135, 0.04), transparent),
      radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: auto, auto, 24px 24px;
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.5;
  }

  .shell {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 88px 24px 40px;
    flex: 1;
  }

  header {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 56px;
  }

  .avatar {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    border-radius: 16px;
    border: 1px solid rgba(126, 231, 135, 0.35);
    background: linear-gradient(160deg, rgba(126, 231, 135, 0.12), rgba(126, 231, 135, 0.02));
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }

  .titles h1 {
    font-size: 34px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .handle {
    display: block;
    margin-top: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .handle::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: 1px;
  }

  section { margin-bottom: 40px; }

  .section-label {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 4px;
  }

  .links {
    border-top: 1px solid var(--divider);
    border-bottom: 1px solid var(--divider);
  }

  .link {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--divider);
    text-decoration: none;
    color: var(--fg);
    transition: background-color 0.15s ease, padding-left 0.15s ease;
  }

  .link:last-child { border-bottom: none; }

  .link:hover {
    background-color: rgba(255, 255, 255, 0.025);
    padding-left: 12px;
  }

  .link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--radius);
  }

  .link svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--muted);
    transition: color 0.15s ease;
  }

  .link svg.line {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .link svg.brand {
    fill: currentColor;
    stroke: none;
  }

  .link:hover svg { color: var(--accent); }

  .link .label {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
  }

  .link .tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 3px 8px;
    border: 1px solid rgba(126, 231, 135, 0.25);
    border-radius: 999px;
    white-space: nowrap;
  }

  .link .arrow {
    font-size: 14px;
    color: var(--dim);
    transition: transform 0.15s ease, color 0.15s ease;
  }

  .link:hover .arrow {
    transform: translate(2px, -2px);
    color: var(--accent);
  }

  footer {
    margin-top: 40px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    color: var(--dim);
  }

  @media (max-width: 480px) {
    .shell { padding-top: 56px; }
    h1 { font-size: 28px; }
    .avatar { width: 52px; height: 52px; font-size: 21px; border-radius: 14px; }
  }
</style>
</head>
