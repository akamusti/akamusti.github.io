<style>
  :root {
    --bg: #0b0d10;
    --fg: #eef2f3;
    --muted: #9aa4ad;
    --accent: #7df0ff;
    --accent2: #ff9d6b;
    --card: rgba(13, 17, 20, 0.62);
    --stroke: rgba(125, 240, 255, 0.22);
    --shade1: rgba(5, 8, 10, 0.45);
    --shade2: rgba(5, 8, 10, 0.72);
    --meta: #0b0d10;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--fg);
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 16px 32px;
  }
  /* fullscreen wallpaper */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -3;
    background: url("img/wallpaper.jpg") center / cover no-repeat;
    transform: scale(1.05);
    filter: saturate(1.05);
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 50% 30%, transparent 30%, var(--shade1) 100%),
      linear-gradient(180deg, var(--shade1), var(--shade2));
  }
  #sparkles { position: fixed; inset: 0; z-index: -2; pointer-events: none; }

  /* topbar — fotodaki gibi: sol logo + sayfalar, sağ ikonlar + buton */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    border-bottom: 1px solid var(--stroke);
  }
  .topbar-inner {
    max-width: 1100px; margin: 0 auto; height: 60px; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .top-left { display: flex; align-items: center; gap: 28px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); flex: none; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; border: 1px solid var(--stroke); display: block; }
  .brand span { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
  .top-links { display: flex; align-items: center; gap: 22px; }
  .top-links a {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px; color: var(--muted); text-decoration: none; white-space: nowrap;
    transition: color 0.15s ease;
  }
  .top-links a:hover { color: var(--fg); }
  .topbar .theme { position: relative; top: auto; right: auto; z-index: auto; display: block; }
  .topbar .theme-btn {
    width: 36px; height: 36px; border-radius: 10px;
    border: 0; background: transparent; box-shadow: none;
    backdrop-filter: none; -webkit-backdrop-filter: none;
    color: var(--muted); font-size: 18px;
  }
  .topbar .theme-btn:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: transparent; box-shadow: none; transform: none; }
  .topbar .theme-panel { position: absolute; top: calc(100% + 10px); right: 0; margin-top: 0; z-index: 40; }
  .top-right { display: flex; align-items: center; gap: 2px; flex: none; }
  .topbar .lang { position: relative; display: block; }
  .lang-btn {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  }
  .icon-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; text-decoration: none;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .icon-btn:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .icon-btn svg { width: 18px; height: 18px; display: block; }
  .cta {
    margin-left: 10px; flex: none;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
    padding: 9px 18px; border-radius: 6px;
    background: var(--accent); color: #0b0d10; text-decoration: none;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .cta:hover { filter: brightness(1.08); transform: translateY(-1px); }

  .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 40px color-mix(in srgb, var(--accent) 7%, transparent), inset 0 1px 0 rgba(255,255,255,0.08);
    padding: 32px 28px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 70%, transparent), transparent);
  }
  .avatar-wrap { position: relative; width: 118px; height: 118px; margin: 0 auto 14px; }
  .avatar {
    width: 118px; height: 118px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
    box-shadow: 0 0 30px color-mix(in srgb, var(--accent) 35%, transparent);
    display: block;
  }
  .status {
    position: absolute; bottom: 8px; right: 8px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #3ba55c;
    border: 4px solid #10141a;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .badge {
    width: 20px; height: 20px; flex: none;
    color: var(--accent);
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 80%, transparent));
  }
  .handle { color: var(--muted); font-size: 13px; margin-top: 2px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .bio { margin-top: 10px; font-size: 15px; color: var(--fg); opacity: 0.92; min-height: 22px; }
  .bio .cursor { color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .rule {
    height: 1px; margin: 18px 0;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 35%, transparent), transparent);
  }
  .links { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .link-btn {
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--fg);
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .link-btn:hover {
    transform: translateY(-2px) scale(1.06);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-color: color-mix(in srgb, var(--accent) 50%, transparent);
    box-shadow: 0 6px 24px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .link-btn svg { width: 21px; height: 21px; opacity: 0.92; }
  .link-btn .arrow { display: none; }

  /* music player */
  .player {
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .disc {
    width: 48px; height: 48px; border-radius: 50%; flex: none;
    object-fit: cover;
    border: 2px solid color-mix(in srgb, var(--accent) 40%, transparent);
    animation: spin 8s linear infinite;
    animation-play-state: paused;
  }
  .player.playing .disc { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { flex: 1; min-width: 0; text-align: left; }
  .title { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 12px; color: var(--muted); }
  .bar { height: 4px; border-radius: 99px; background: rgba(255,255,255,0.12); margin-top: 8px; cursor: pointer; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); }
  .controls { display: flex; align-items: center; gap: 10px; }
  .play {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--fg); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .play:hover { background: color-mix(in srgb, var(--accent) 25%, transparent); transform: scale(1.05); }
  .vol { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .vol input { width: 64px; accent-color: var(--accent); cursor: pointer; }
  .time { font-size: 11px; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; }

  footer {
    text-align: center;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11.5px; color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  footer .sep { margin: 0 8px; opacity: 0.5; }
  @media (max-width: 640px) {
    .topbar-inner { padding: 0 12px; gap: 10px; }
    .top-left { gap: 16px; }
    .brand span { display: none; }
    .top-links { gap: 14px; }
    .top-links a { font-size: 13px; }
    .cta { padding: 8px 12px; font-size: 12px; }
  }
  @media (max-width: 480px) {
    body { padding: 92px 12px 24px; }
    .card { padding: 26px 20px 22px; }
    .avatar-wrap, .avatar { width: 96px; height: 96px; }
    h1 { font-size: 24px; }
    .player { padding: 12px 14px; gap: 10px; }
    .disc { width: 40px; height: 40px; }
    .vol { display: none; }
    .play { width: 46px; height: 46px; }
  }
</style>
</head>

<script>
  // animated tab title
  const titles = ["akaMusti", "@akamusti", "Ur Virtual Puppyboy :3"];
  let ti = 0;
  setInterval(() => { document.title = titles[ti++ % titles.length]; }, 2500);

  // typewriter bio — dil değişince baştan yazar
  const el = document.getElementById("typed");
  let typeTimer = null;
  function typeBio() {
    var lang = (window.__akamustiLang && window.__akamustiLang.current()) || "tr";
    var text = (window.__akamustiLang && window.__akamustiLang.t("home.bio", lang)) || "Ur Virtual Puppyboy :3";
    if (typeTimer) clearTimeout(typeTimer);
    let ci = 0;
    el.textContent = "";
    (function type() {
      el.textContent = text.slice(0, ++ci);
      if (ci <= text.length) typeTimer = setTimeout(type, 70);
    })();
  }
  typeBio();
  document.addEventListener("akamusti:lang", typeBio);

  // music player
  const audio = document.getElementById("audio");
  const playBtn = document.getElementById("play");
  const player = document.getElementById("player");
  const fill = document.getElementById("fill");
  const bar = document.getElementById("bar");
  const vol = document.getElementById("vol");
  audio.volume = 0.7;
  function toggle() {
    if (audio.paused) { audio.play().catch(() => {}); }
    else audio.pause();
  }
  playBtn.addEventListener("click", toggle);
  audio.addEventListener("play", () => { player.classList.add("playing"); playBtn.textContent = "⏸"; });
  audio.addEventListener("pause", () => { player.classList.remove("playing"); playBtn.textContent = "▶"; });
  audio.addEventListener("timeupdate", () => {
    if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + "%";
  });
  bar.addEventListener("click", (e) => {
    const r = bar.getBoundingClientRect();
    const p = (e.clientX - r.left) / r.width;
    if (audio.duration) audio.currentTime = p * audio.duration;
  });
  vol.addEventListener("input", () => { audio.volume = vol.value / 100; });
  // start on first interaction (browser autoplay policy friendly)
  window.addEventListener("pointerdown", function once() {
    if (audio.paused) audio.play().catch(() => {});
    window.removeEventListener("pointerdown", once);
  }, { once: true });

  // fireflies / sparkles — rengi aktif temadan alır
  const c = document.getElementById("sparkles");
  const ctx = c.getContext("2d");
  let W, H, parts = [];
  let spark1 = "#7df0ff", spark2 = "#ff9d6b";
  function readSpark() {
    try {
      const cs = getComputedStyle(document.documentElement);
      spark1 = cs.getPropertyValue("--accent").trim() || spark1;
      spark2 = cs.getPropertyValue("--accent2").trim() || spark2;
    } catch (e) {}
  }
  readSpark();
  document.addEventListener("akamusti:theme", readSpark);
  function resize() {
    W = c.width = innerWidth; H = c.height = innerHeight;
  }
  resize(); addEventListener("resize", resize);
  for (let i = 0; i < 70; i++) {
    parts.push({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      r: Math.random() * 2 + 0.5, s: Math.random() * 0.4 + 0.1,
      o: Math.random() * Math.PI * 2, first: Math.random() > 0.3
    });
  }
  function hexA(hex, a) {
    // #rrggbb -> rgba string
    const m = hex.match(/^#([0-9a-f]{6})$/i);
    if (!m) return `rgba(125,240,255,${a})`;
    const n = parseInt(m[1], 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.y -= p.s; p.o += 0.02;
      if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
      const a = 0.35 + Math.abs(Math.sin(p.o)) * 0.55;
      const col = p.first ? spark1 : spark2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = hexA(col, a);
      ctx.shadowBlur = 12;
      ctx.shadowColor = col;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    requestAnimationFrame(loop);
  })();
</script>
