<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}akaMusti</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}akaMusti">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/img/pfp.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/img/pfp.jpg">
<style>
  :root {
    --bg: #0b0d10;
    --fg: #eef2f3;
    --muted: #9aa4ad;
    --accent: #7df0ff;
    --accent2: #ff9d6b;
    --card: rgba(13, 17, 20, 0.62);
    --stroke: rgba(125, 240, 255, 0.22);
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--fg);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 72px 16px 32px;
    line-height: 1.6;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: url("/img/wallpaper.jpg") center / cover no-repeat fixed;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 50% 30%, transparent 30%, rgba(5, 8, 10, 0.55) 100%),
      linear-gradient(180deg, rgba(5, 8, 10, 0.45), rgba(5, 8, 10, 0.78));
  }

  /* top-left menu (same as homepage) */
  .menu { position: fixed; top: 18px; left: 18px; z-index: 10; }
  .menu-btn {
    width: 44px; height: 44px; border-radius: 14px;
    border: 1px solid var(--stroke);
    background: var(--card);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    color: var(--fg); font-size: 19px; cursor: pointer;
  }
  .menu-btn:hover { background: rgba(125, 240, 255, 0.12); border-color: rgba(125, 240, 255, 0.5); }
  .menu-drop {
    margin-top: 8px; min-width: 150px; border-radius: 14px;
    border: 1px solid var(--stroke); background: var(--card);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    padding: 6px; display: none;
  }
  .menu.open .menu-drop { display: block; }
  .menu-drop a {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px;
    color: var(--fg); text-decoration: none;
    font-size: 14px; font-weight: 600;
  }
  .menu-drop a:hover { background: rgba(125, 240, 255, 0.12); }
  .menu-drop a span.ic { color: var(--accent); }

  .shell {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(125, 240, 255, 0.07), inset 0 1px 0 rgba(255,255,255,0.08);
    padding: 32px 32px 28px;
    position: relative;
    overflow: hidden;
  }
  .shell::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(125,240,255,0.7), transparent);
  }

  header { text-align: center; margin-bottom: 8px; }

  .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(125, 240, 255, 0.55);
    box-shadow: 0 0 24px rgba(125, 240, 255, 0.3);
    margin-bottom: 8px;
  }

  .titles h1 { font-size: 22px; font-weight: 700; }
  .titles h1 a { color: var(--fg); text-decoration: none; }
  .titles h1 a:hover { color: var(--accent); }

  main { width: 100%; margin-top: 12px; }

  .back {
    display: inline-block;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 12px;
  }
  .back:hover { color: var(--accent); }

  .page-title { font-size: 30px; font-weight: 700; margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 6px; }

  .rule {
    height: 1px; margin: 16px 0;
    background: linear-gradient(90deg, transparent, rgba(125,240,255,0.35), transparent);
  }

  .post-box {
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.045);
    text-decoration: none;
    color: var(--fg);
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .post-box:hover {
    transform: translateY(-1px);
    background: rgba(125, 240, 255, 0.10);
    border-color: rgba(125, 240, 255, 0.4);
    box-shadow: 0 6px 24px rgba(125, 240, 255, 0.15);
  }
  .pb-title { flex: 1; font-size: 16px; font-weight: 600; }
  .pb-date {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  .blog-empty { padding: 13px 0; font-size: 15px; color: var(--muted); }

  .post-title { font-size: 27px; font-weight: 700; line-height: 1.25; margin-bottom: 8px; }
  .post-meta {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.08em;
    color: var(--muted); margin-bottom: 20px;
  }
  .post-content { font-size: 16px; line-height: 1.75; }
  .post-content p { margin-bottom: 1.25em; }
  .post-content h2 { font-size: 21px; margin: 1.5em 0 0.6em; }
  .post-content h3 { font-size: 17px; margin: 1.5em 0 0.5em; }
  .post-content a { color: var(--accent); }
  .post-content ul, .post-content ol { margin: 0 0 1.25em 1.25em; }
  .post-content li { margin-bottom: 0.4em; }
  .post-content blockquote {
    border-left: 2px solid rgba(125, 240, 255, 0.4);
    padding-left: 16px; margin: 0 0 1.25em; color: var(--muted);
  }
  .post-content code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.85em;
    background: rgba(255, 255, 255, 0.06);
    padding: 2px 6px; border-radius: 6px;
  }
  .post-content pre {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 12px; padding: 16px;
    overflow-x: auto; margin-bottom: 1.25em;
  }
  .post-content pre code { background: none; padding: 0; }
  .post-content img { max-width: 100%; border-radius: 12px; }
  .post-content hr {
    border: none; border-top: 1px solid rgba(255,255,255,0.12);
    margin: 2em auto; width: 120px;
  }

  footer {
    margin-top: 24px;
    text-align: center;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--muted);
  }

  @media (max-width: 480px) {
    body { padding: 64px 12px 24px; }
    .shell { padding: 24px 20px 22px; }
    .page-title { font-size: 25px; }
    .post-title { font-size: 23px; }
  }
</style>
</head>
<body>
<div class="bg"></div>

<nav class="menu" id="menu">
  <button class="menu-btn" id="menuBtn" aria-label="menü" aria-expanded="false">☰</button>
  <div class="menu-drop">
    <a href="/"><span class="ic">⌂</span> ana sayfa</a>
    <a href="/blog/"><span class="ic">✎</span> blog</a>
  </div>
</nav>

<div class="shell">
  <header>
    <img class="avatar" src="/img/pfp.jpg" alt="akaMusti">
    <div class="titles">
      <h1><a href="/">akaMusti</a></h1>
    </div>
  </header>

  <main>
{{ content }}
  </main>

  <footer>&copy; 2026 akaMusti</footer>
</div>

<script>
  const menu = document.getElementById("menu");
  const menuBtn = document.getElementById("menuBtn");
  menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = menu.classList.toggle("open");
    menuBtn.setAttribute("aria-expanded", open);
    menuBtn.textContent = open ? "✕" : "☰";
  });
  document.addEventListener("click", (e) => {
    if (!menu.contains(e.target)) {
      menu.classList.remove("open");
      menuBtn.setAttribute("aria-expanded", "false");
      menuBtn.textContent = "☰";
    }
  });
</script>
</body>
</html>
