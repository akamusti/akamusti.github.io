<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}akaMusti</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}akaMusti">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="akaMusti">
<meta property="og:locale" content="tr_TR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} — {% endif %}akaMusti">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ site.url }}/img/og.png">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" href="/img/pfp.jpg">
<link rel="stylesheet" href="/assets/themes.css">
<script>try{var _t=localStorage.getItem("akamusti-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<script>try{var _l=localStorage.getItem("akamusti-lang");if(_l==="en"||_l==="tr")document.documentElement.setAttribute("lang",_l);}catch(e){}</script>
</head>
<body>

<header class="nav">
  <div class="nav-in">
    <a class="logo" href="/">
      <span>akaMusti</span>
    </a>
    <nav class="nav-links">
      <a href="/#hakkimda" class="hide-mobile" data-i18n="nav.about">hakkımda</a>
      <a href="/blog/"{% if page.url contains '/blog' %} aria-current="page"{% endif %} data-i18n="nav.journal">günlük</a>
      <a href="/defter/"{% if page.url contains '/defter' %} aria-current="page"{% endif %} data-i18n="nav.guestbook">defter</a>
      <a href="/projeler/"{% if page.url contains '/projeler' %} aria-current="page"{% endif %} data-i18n="nav.projects">projeler</a>
    </nav>
    <div class="nav-right">
      <div class="theme" id="theme">
        <button class="theme-btn" id="themeBtn" aria-label="tema değiştir" aria-expanded="false" title="tema değiştir (T)">◑</button>
        <div class="theme-panel" role="menu" aria-label="temalar"></div>
      </div>
      <div class="lang" id="lang">
        <button class="icon-btn lang-btn" id="langBtn" aria-label="language" aria-expanded="false" title="TR/EN">EN</button>
        <div class="lang-panel" role="menu" aria-label="language"></div>
      </div>
      <a class="icon-btn" href="/blog/feed.xml" title="rss" aria-label="rss">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4.4v3c7 0 12.6 5.6 12.6 12.6h3C19.6 11.7 12.3 4.4 4 4.4zm0 6v3c3.7 0 6.6 2.9 6.6 6.6h3c0-5.3-4.3-9.6-9.6-9.6zM6.2 15.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z"/></svg>
      </a>
      <a class="icon-btn" href="https://github.com/akamusti" target="_blank" rel="noopener" title="github" aria-label="github">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.7 5.38-5.26 5.67.41.35.77 1.05.77 2.12v3.14c0 .3.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
      </a>
    </div>
  </div>
</header>

<div class="shell reveal">
  <main>
{{ content }}
  </main>
</div>

<footer>
  <span>© 2026 akaMusti</span>
  <span class="sep">·</span>
  <a href="/gizlilik/" data-i18n="footer.privacy">gizlilik</a>
  <span class="sep">·</span>
  <span style="opacity: 0.75;"><kbd>T</kbd> tema &nbsp;<kbd>M</kbd> müzik</span>
</footer>

<div class="player-pop closed" id="playerPop">
  <div class="player" id="player" role="dialog" aria-label="müzik çalar">
    <button class="player-close" id="playerClose" aria-label="kapat" title="kapat (Esc)">✕</button>
    <div class="disc-wrap">
      <img class="disc" src="/img/disc.jpg" alt="album art">
    </div>
    <div class="meta">
      <div class="title">Salvatore — dreamy version</div>
      <div class="artist-row">
        <span class="artist">Lana Del Rey</span>
        <span class="player-time" id="playerTime">0:00 / 0:00</span>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><div id="fill"></div></div>
    </div>
    <div class="controls">
      <div class="vol">
        <button type="button" id="volBtn" aria-label="sesi kapat/aç" title="sesi kapat/aç">♪</button>
        <input id="vol" type="range" min="0" max="100" value="70" aria-label="ses seviyesi">
      </div>
      <button class="play" id="play" aria-label="oynat/durdur" title="oynat/durdur (M)">
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    <audio id="audio" src="/assets/salvatore.mp3" preload="metadata" loop></audio>
  </div>
  <button class="player-fab" id="playerFab" aria-label="müziği aç" title="müziği aç (M)">♪</button>
</div>

<script>
  // music player — sağ alt popup
  (function () {
    var audio = document.getElementById("audio");
    var playBtn = document.getElementById("play");
    var player = document.getElementById("player");
    var pop = document.getElementById("playerPop");
    var closeBtn = document.getElementById("playerClose");
    var fab = document.getElementById("playerFab");
    var fill = document.getElementById("fill");
    var bar = document.getElementById("bar");
    var vol = document.getElementById("vol");
    var volBtn = document.getElementById("volBtn");
    var timeDisplay = document.getElementById("playerTime");
    var POP_KEY = "akamusti-player-closed";
    var VOL_KEY = "akamusti-player-vol";
    if (!audio) return;

    var savedVol = 70;
    try {
      var v = localStorage.getItem(VOL_KEY);
      if (v !== null) savedVol = parseInt(v, 10);
    } catch (e) {}
    vol.value = savedVol;
    audio.volume = savedVol / 100;

    function formatTime(s) {
      if (isNaN(s)) return "0:00";
      var m = Math.floor(s / 60);
      var sec = Math.floor(s % 60);
      return m + ":" + (sec < 10 ? "0" : "") + sec;
    }

    function isClosed() { try { return localStorage.getItem(POP_KEY) === "1"; } catch (e) { return false; } }
    function setClosed(v) { try { localStorage.setItem(POP_KEY, v ? "1" : "0"); } catch (e) {} }

    function openPop() {
      pop.classList.remove("closed");
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ pop.classList.add("open"); }); });
      setClosed(false);
    }
    function closePop() {
      pop.classList.remove("open");
      setTimeout(function(){ pop.classList.add("closed"); }, 250);
      setClosed(true);
    }

    if (isClosed()) { pop.classList.add("closed"); }
    else { pop.classList.remove("closed"); setTimeout(function(){ pop.classList.add("open"); }, 600); }

    closeBtn.addEventListener("click", closePop);
    fab.addEventListener("click", openPop);

    function updatePlayIcon(isPlaying) {
      if (isPlaying) {
        player.classList.add("playing");
        playBtn.innerHTML = '<svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
      } else {
        player.classList.remove("playing");
        playBtn.innerHTML = '<svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
      }
    }

    function togglePlay() {
      if (audio.paused) { audio.play().catch(function(){}); }
      else audio.pause();
    }
    playBtn.addEventListener("click", togglePlay);
    audio.addEventListener("play", function() { updatePlayIcon(true); });
    audio.addEventListener("pause", function() { updatePlayIcon(false); });

    audio.addEventListener("timeupdate", function () {
      if (audio.duration) {
        fill.style.width = (audio.currentTime / audio.duration * 100) + "%";
        if (timeDisplay) {
          timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
        }
      }
    });

    audio.addEventListener("loadedmetadata", function () {
      if (timeDisplay) {
        timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      }
    });

    bar.addEventListener("click", function (e) {
      var r = bar.getBoundingClientRect();
      var p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      if (audio.duration) audio.currentTime = p * audio.duration;
    });

    vol.addEventListener("input", function () {
      audio.volume = vol.value / 100;
      try { localStorage.setItem(VOL_KEY, vol.value); } catch (e) {}
    });

    var prevVol = 70;
    volBtn.addEventListener("click", function () {
      if (audio.volume > 0) {
        prevVol = vol.value;
        audio.volume = 0;
        vol.value = 0;
      } else {
        audio.volume = (prevVol || 70) / 100;
        vol.value = prevVol || 70;
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
      var tag = (e.target && e.target.tagName) || "";
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (e.target && e.target.isContentEditable)) return;
      if (e.key === "m" || e.key === "M" || e.key === "ь" || e.key === "Ь") {
        togglePlay();
      }
      if (e.key === "Escape" && !pop.classList.contains("closed")) {
        closePop();
      }
    });
  })();
</script>

<script>
  // scroll reveal
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.querySelectorAll(".reveal").forEach(function (e) { e.classList.add("in"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, { threshold: 0.08 });
    document.querySelectorAll(".reveal").forEach(function (el) { io.observe(el); });
  })();
</script>
<script src="/assets/theme.js" defer></script>
<script src="/assets/lang.js" defer></script>
</body>
</html>
