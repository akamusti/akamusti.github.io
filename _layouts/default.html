<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}akaMusti</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}akaMusti">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/img/pfp.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/img/pfp.jpg">
<link rel="stylesheet" href="/assets/themes.css">
<script>try{var _t=localStorage.getItem("akamusti-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<script>try{var _l=localStorage.getItem("akamusti-lang");if(_l==="en"||_l==="tr")document.documentElement.setAttribute("lang",_l);}catch(e){}</script>
<style>
  :root {
    --bg: #0b0d10;
    --fg: #eef2f3;
    --muted: #9aa4ad;
    --accent: #7df0ff;
    --accent2: #ff9d6b;
    --stroke: rgba(125, 240, 255, 0.22);
    --meta: #0b0d10;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--fg);
    background: var(--bg);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* nav */
  .nav { border-bottom: 1px solid var(--stroke); position: sticky; top: 0; background: var(--bg); z-index: 30; }
  .nav-in {
    max-width: 720px; margin: 0 auto; height: 54px; padding: 0 20px;
    display: flex; align-items: center; gap: 24px;
  }
  .logo { font-weight: 800; font-size: 16px; color: var(--fg); text-decoration: none; flex: none; }
  .logo:hover { color: var(--accent); }
  .nav-links { display: flex; gap: 18px; flex: 1; min-width: 0; }
  .nav-links a { font-size: 14px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .nav-links a:hover { color: var(--fg); }
  .nav-links a[aria-current="page"] { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 2px; flex: none; }
  .nav .theme { position: relative; display: block; }
  .nav .theme-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 0; background: transparent; box-shadow: none;
    color: var(--muted); font-size: 16px; cursor: pointer;
  }
  .nav .theme-btn:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .nav .theme-panel { position: absolute; top: calc(100% + 10px); right: 0; z-index: 40; }
  .nav .lang { position: relative; display: block; }
  .icon-btn {
    min-width: 32px; height: 32px; padding: 0 6px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; text-decoration: none;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700;
  }
  .icon-btn:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .icon-btn svg { width: 16px; height: 16px; display: block; }

  .shell { max-width: 720px; margin: 0 auto; padding: 48px 20px 24px; }

  .back {
    display: inline-block;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12.5px; color: var(--muted); text-decoration: none;
    margin-bottom: 16px;
  }
  .back:hover { color: var(--accent); }
  .page-title { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
  .sub { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
  .rule { height: 1px; margin: 20px 0; background: var(--stroke); }

  .post-box {
    display: flex; align-items: baseline; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--stroke);
    text-decoration: none; color: var(--fg);
  }
  .post-box:last-child { border-bottom: 1px solid var(--stroke); }
  .post-box:hover .pb-title { color: var(--accent); }
  .pb-title { flex: 1; font-size: 15.5px; font-weight: 600; }
  .pb-date { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .blog-empty { padding: 12px 0; font-size: 15px; color: var(--muted); }

  .post-title { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.25; }
  .post-meta { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); margin-top: 6px; margin-bottom: 24px; }
  .post-content { font-size: 15.5px; line-height: 1.75; }
  .post-content p { margin-bottom: 1.25em; }
  .post-content h2 { font-size: 21px; margin: 1.5em 0 0.6em; }
  .post-content h3 { font-size: 17px; margin: 1.5em 0 0.5em; }
  .post-content a { color: var(--accent); }
  .post-content ul, .post-content ol { margin: 0 0 1.25em 1.25em; }
  .post-content li { margin-bottom: 0.4em; }
  .post-content blockquote { border-left: 2px solid var(--stroke); padding-left: 16px; margin: 0 0 1.25em; color: var(--muted); }
  .post-content code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85em; background: color-mix(in srgb, var(--fg) 8%, transparent); padding: 2px 6px; border-radius: 6px; }
  .post-content pre { border: 1px solid var(--stroke); border-radius: 12px; padding: 16px; overflow-x: auto; margin-bottom: 1.25em; }
  .post-content pre code { background: none; padding: 0; }
  .post-content img { max-width: 100%; border-radius: 12px; }
  .post-content hr { border: none; border-top: 1px solid var(--stroke); margin: 2em auto; width: 120px; }

  footer {
    max-width: 720px; margin: 0 auto; padding: 24px 20px 32px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11.5px; color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  footer .sep { margin: 0 8px; opacity: 0.5; }

  /* scroll reveal */
  .reveal { opacity: 0; transform: translateY(12px); }
  .reveal.in { opacity: 1; transform: none; transition: opacity 0.45s ease, transform 0.45s ease; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; } }

  @media (max-width: 640px) {
    .nav-in { padding: 0 12px; gap: 10px; }
    .nav-links { gap: 10px; }
    .nav-links a { font-size: 13px; }
    .hide-mobile { display: none; }
    .nav-right > a.icon-btn { display: none; }
    .shell { padding: 36px 16px 20px; }
    .page-title { font-size: 28px; }
    .post-title { font-size: 25px; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-in">
    <a class="logo" href="/">akaMusti</a>
    <nav class="nav-links">
      <a href="/#hakkimda" class="hide-mobile" data-i18n="nav.about">hakkımda</a>
      <a href="/blog/"{% if page.url contains '/blog' %} aria-current="page"{% endif %} data-i18n="nav.journal">günlük</a>
      <a href="/defter/"{% if page.url contains '/defter' %} aria-current="page"{% endif %} data-i18n="nav.guestbook">defter</a>
      <a href="/projeler/"{% if page.url contains '/projeler' %} aria-current="page"{% endif %} data-i18n="nav.projects">projeler</a>
    </nav>
    <div class="nav-right">
      <div class="theme" id="theme">
        <button class="theme-btn" id="themeBtn" aria-label="tema değiştir" aria-expanded="false" title="tema değiştir (T)">◑</button>
        <div class="theme-panel" role="menu" aria-label="temalar"></div>
      </div>
      <div class="lang" id="lang">
        <button class="icon-btn lang-btn" id="langBtn" aria-label="language" aria-expanded="false" title="TR/EN">EN</button>
        <div class="lang-panel" role="menu" aria-label="language"></div>
      </div>
      <a class="icon-btn" href="/blog/feed.xml" title="rss" aria-label="rss">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4.4v3c7 0 12.6 5.6 12.6 12.6h3C19.6 11.7 12.3 4.4 4 4.4zm0 6v3c3.7 0 6.6 2.9 6.6 6.6h3c0-5.3-4.3-9.6-9.6-9.6zM6.2 15.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z"/></svg>
      </a>
      <a class="icon-btn" href="https://github.com/akamusti" target="_blank" rel="noopener" title="github" aria-label="github">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.7 5.38-5.26 5.67.41.35.77 1.05.77 2.12v3.14c0 .3.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
      </a>
    </div>
  </div>
</header>

<div class="shell reveal">
  <main>
{{ content }}
  </main>
</div>

<footer><span>&copy; 2026 akaMusti</span><span class="sep">·</span><a href="/gizlilik/" data-i18n="footer.privacy">gizlilik</a></footer>

<script>
  // scroll reveal
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll(".reveal").forEach(function (el) { io.observe(el); });
  })();
</script>
<script src="/assets/theme.js" defer></script>
<script src="/assets/lang.js" defer></script>
</body>
</html>
