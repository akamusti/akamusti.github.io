<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}akaMusti</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}akaMusti">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/avatar.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="%230b0d10"/><rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="%23b388ff" stroke-opacity="0.35" stroke-width="3"/><text x="50" y="69" font-size="54" font-family="monospace" font-weight="bold" text-anchor="middle" fill="%23b388ff">i</text></svg>'>
<style>
  :root {
    --bg: #0b0d10;
    --fg: #e2e5e8;
    --muted: #8b93a1;
    --dim: #464c56;
    --divider: rgba(255, 255, 255, 0.07);
    --accent: #b388ff;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  ::selection {
    background: rgba(179, 136, 255, 0.25);
    color: var(--fg);
  }

  body {
    font-family: "Times New Roman", Times, serif;
    color: var(--fg);
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 85% 45% at 50% -18%, rgba(179, 136, 255, 0.07), transparent),
      radial-gradient(ellipse 55% 35% at 85% 110%, rgba(179, 136, 255, 0.04), transparent);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.6;
  }

  .shell {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 40px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  header { margin-bottom: 20px; }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px double rgba(179, 136, 255, 0.5);
    margin-bottom: 8px;
  }

  .titles h1 {
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe Print", sans-serif;
    font-size: 28px;
    font-weight: normal;
  }

  .titles h1 a {
    color: var(--accent);
    text-decoration: none;
  }

  main {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .back {
    align-self: flex-start;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 12px;
    transition: color 0.15s ease;
  }

  .back:hover { color: var(--accent); }

  .page-title {
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe Print", sans-serif;
    font-weight: normal;
    font-size: 32px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .sub {
    color: var(--muted);
    font-size: 17px;
    margin-bottom: 20px;
  }

  .rule {
    width: 120px;
    height: 1px;
    background: var(--divider);
    margin: 10px auto 18px;
  }

  .post-box {
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 18px;
    margin-bottom: 12px;
    border: 1px solid var(--divider);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.02);
    text-decoration: none;
    color: var(--fg);
    text-align: left;
    transition: border-color 0.15s ease;
  }

  .post-box:hover { border-color: rgba(179, 136, 255, 0.4); }

  .pb-title {
    flex: 1;
    font-size: 18px;
  }

  .post-box:hover .pb-title { color: var(--accent); }

  .pb-date {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    color: var(--dim);
    white-space: nowrap;
  }

  .blog-empty {
    padding: 13px 0;
    font-size: 16px;
    color: var(--muted);
  }

  .post-title {
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe Print", sans-serif;
    font-weight: normal;
    font-size: 30px;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .post-meta {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--dim);
    margin-bottom: 24px;
  }

  .post-content {
    font-size: 17px;
    line-height: 1.75;
    color: var(--fg);
    text-align: left;
    width: 100%;
  }

  .post-content p { margin-bottom: 1.25em; }

  .post-content h2 {
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe Print", sans-serif;
    font-weight: normal;
    font-size: 22px;
    margin: 1.5em 0 0.6em;
  }

  .post-content h3 { font-size: 18px; margin: 1.5em 0 0.5em; }

  .post-content a { color: var(--accent); }

  .post-content ul, .post-content ol { margin: 0 0 1.25em 1.25em; }

  .post-content li { margin-bottom: 0.4em; }

  .post-content blockquote {
    border-left: 2px solid rgba(179, 136, 255, 0.4);
    padding-left: 16px;
    margin: 0 0 1.25em;
    color: var(--muted);
  }

  .post-content code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.85em;
    background: rgba(255, 255, 255, 0.06);
    padding: 2px 6px;
    border-radius: 6px;
  }

  .post-content pre {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--divider);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    margin-bottom: 1.25em;
  }

  .post-content pre code { background: none; padding: 0; }

  .post-content img { max-width: 100%; border-radius: 8px; }

  .post-content hr {
    border: none;
    border-top: 1px solid var(--divider);
    margin: 2em auto;
    width: 120px;
  }

  footer {
    margin-top: 28px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    color: var(--dim);
  }

  @media (max-width: 480px) {
    .shell { padding-top: 40px; }
    .page-title { font-size: 27px; }
    .post-title { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <img class="avatar" src="/avatar.jpg" alt="akaMusti profile photo">
    <div class="titles">
      <h1><a href="/">akaMusti</a></h1>
    </div>
  </header>

  <main>
{{ content }}
  </main>

  <footer>&copy; 2026 akaMusti</footer>
</div>
</body>
</html>
