<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}akaMusti</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}akaMusti">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/img/pfp.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/img/pfp.jpg">
<link rel="stylesheet" href="/assets/themes.css">
<script>try{var _t=localStorage.getItem("akamusti-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<style>
  :root {
    --bg: #0b0d10;
    --fg: #eef2f3;
    --muted: #9aa4ad;
    --accent: #7df0ff;
    --accent2: #ff9d6b;
    --card: rgba(13, 17, 20, 0.62);
    --stroke: rgba(125, 240, 255, 0.22);
    --shade1: rgba(5, 8, 10, 0.45);
    --shade2: rgba(5, 8, 10, 0.78);
    --meta: #0b0d10;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--fg);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 72px 16px 32px;
    line-height: 1.6;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: url("/img/wallpaper.jpg") center / cover no-repeat fixed;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 50% 30%, transparent 30%, var(--shade1) 100%),
      linear-gradient(180deg, var(--shade1), var(--shade2));
  }

  /* top-left menu (same as homepage) */
  .menu { position: fixed; top: 24px; left: 24px; z-index: 10; }
  .menu-btn {
    width: 56px; height: 56px; border-radius: 18px;
    border: 1px solid var(--stroke);
    background: var(--card);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    color: var(--fg); font-size: 24px; cursor: pointer;
  }
  .menu-btn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .menu-drop {
    margin-top: 12px; min-width: 340px; border-radius: 22px;
    border: 1px solid var(--stroke); background: var(--card);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    padding: 10px; display: none; overflow: hidden;
    transform-origin: top left;
  }
  .menu.open .menu-drop {
    display: block;
    animation: menu-pop 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.15);
  }
  @keyframes menu-pop {
    from { opacity: 0; transform: translateY(-8px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  .menu.open .menu-drop a { animation: menu-item 0.25s ease backwards; }
  .menu.open .menu-drop a:nth-of-type(1) { animation-delay: 0.02s; }
  .menu.open .menu-drop a:nth-of-type(2) { animation-delay: 0.06s; }
  .menu.open .menu-drop a:nth-of-type(3) { animation-delay: 0.1s; }
  .menu.open .menu-drop a:nth-of-type(4) { animation-delay: 0.14s; }
  @keyframes menu-item {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: none; }
  }
  .menu.open .menu-btn {
    border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5), 0 0 20px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  @media (prefers-reduced-motion: reduce) {
    .menu.open .menu-drop, .menu.open .menu-drop a { animation: none; }
  }
  .menu-head {
    padding: 12px 16px 10px;
    font-size: 13px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .menu-drop a {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px; border-radius: 14px;
    color: var(--fg); text-decoration: none;
    transition: background 0.15s ease;
  }
  .menu-drop a:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .menu-drop a[aria-current="page"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .menu-drop a .ic {
    width: 52px; height: 52px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
    font-size: 22px;
  }
  .menu-drop a .tx b { display: block; font-size: 18px; font-weight: 700; }
  .menu-drop a .tx small { display: block; font-size: 14px; color: var(--muted); font-weight: 500; }

  .shell {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 40px color-mix(in srgb, var(--accent) 7%, transparent), inset 0 1px 0 rgba(255,255,255,0.08);
    padding: 32px 32px 28px;
    position: relative;
    overflow: hidden;
  }
  .shell::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 70%, transparent), transparent);
  }

  header { text-align: center; margin-bottom: 8px; }

  .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 30%, transparent);
    margin-bottom: 8px;
  }

  .titles h1 { font-size: 22px; font-weight: 700; }
  .titles h1 a { color: var(--fg); text-decoration: none; }
  .titles h1 a:hover { color: var(--accent); }

  main { width: 100%; margin-top: 12px; }

  .back {
    display: inline-block;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 12px;
  }
  .back:hover { color: var(--accent); }

  .page-title { font-size: 30px; font-weight: 700; margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 6px; }

  .rule {
    height: 1px; margin: 16px 0;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 35%, transparent), transparent);
  }

  .post-box {
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.045);
    text-decoration: none;
    color: var(--fg);
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .post-box:hover {
    transform: translateY(-1px);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
    box-shadow: 0 6px 24px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .pb-title { flex: 1; font-size: 16px; font-weight: 600; }
  .pb-date {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  .blog-empty { padding: 13px 0; font-size: 15px; color: var(--muted); }

  .post-title { font-size: 27px; font-weight: 700; line-height: 1.25; margin-bottom: 8px; }
  .post-meta {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.08em;
    color: var(--muted); margin-bottom: 20px;
  }
  .post-content { font-size: 16px; line-height: 1.75; }
  .post-content p { margin-bottom: 1.25em; }
  .post-content h2 { font-size: 21px; margin: 1.5em 0 0.6em; }
  .post-content h3 { font-size: 17px; margin: 1.5em 0 0.5em; }
  .post-content a { color: var(--accent); }
  .post-content ul, .post-content ol { margin: 0 0 1.25em 1.25em; }
  .post-content li { margin-bottom: 0.4em; }
  .post-content blockquote {
    border-left: 2px solid color-mix(in srgb, var(--accent) 40%, transparent);
    padding-left: 16px; margin: 0 0 1.25em; color: var(--muted);
  }
  .post-content code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.85em;
    background: rgba(255, 255, 255, 0.06);
    padding: 2px 6px; border-radius: 6px;
  }
  .post-content pre {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 12px; padding: 16px;
    overflow-x: auto; margin-bottom: 1.25em;
  }
  .post-content pre code { background: none; padding: 0; }
  .post-content img { max-width: 100%; border-radius: 12px; }
  .post-content hr {
    border: none; border-top: 1px solid rgba(255,255,255,0.12);
    margin: 2em auto; width: 120px;
  }

  footer {
    margin-top: 24px;
    text-align: center;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--muted);
  }

  @media (max-width: 480px) {
    body { padding: 104px 12px 24px; }
    .menu { top: 16px; left: 16px; }
    .menu-drop { min-width: 0; width: calc(100vw - 32px); max-width: 340px; }
    .menu-drop a { gap: 12px; padding: 12px 14px; }
    .menu-drop a .ic { width: 44px; height: 44px; border-radius: 12px; font-size: 19px; }
    .menu-drop a .tx b { font-size: 16px; }
    .menu-drop a .tx small { font-size: 13px; }
    .shell { padding: 24px 20px 22px; }
    .page-title { font-size: 25px; }
    .post-title { font-size: 23px; }
    .post-content { font-size: 15px; }
    .post-box { padding: 12px 14px; }
  }
</style>
</head>
<body>
<div class="bg"></div>

<nav class="menu" id="menu">
  <button class="menu-btn" id="menuBtn" aria-label="menü" aria-expanded="false">☰</button>
  <div class="menu-drop">
    <div class="menu-head">sayfalar</div>
    <a href="/"><span class="ic">⌂</span><span class="tx"><b>ana sayfa</b><small>başa dön</small></span></a>
    <a href="/blog/"{% if page.url contains '/blog' %} aria-current="page"{% endif %}><span class="ic">✎</span><span class="tx"><b>günlük</b><small>yazılarım</small></span></a>
    <a href="/defter/"{% if page.url contains '/defter' %} aria-current="page"{% endif %}><span class="ic">♥</span><span class="tx"><b>defter</b><small>ziyaretçi defteri</small></span></a>
    <a href="/projeler/"{% if page.url contains '/projeler' %} aria-current="page"{% endif %}><span class="ic">⌘</span><span class="tx"><b>projeler</b><small>yaptıklarım</small></span></a>
  </div>
</nav>

<div class="theme" id="theme">
  <button class="theme-btn" id="themeBtn" aria-label="tema değiştir" aria-expanded="false" title="tema değiştir (T)">◑</button>
  <div class="theme-panel" role="menu" aria-label="temalar"></div>
</div>

<div class="shell">
  <header>
    <img class="avatar" src="/img/pfp.jpg" alt="akaMusti">
    <div class="titles">
      <h1><a href="/">akaMusti</a></h1>
    </div>
  </header>

  <main>
{{ content }}
  </main>

  <footer>&copy; 2026 akaMusti</footer>
</div>

<script>
  const menu = document.getElementById("menu");
  const menuBtn = document.getElementById("menuBtn");
  menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = menu.classList.toggle("open");
    menuBtn.setAttribute("aria-expanded", open);
    menuBtn.textContent = open ? "✕" : "☰";
  });
  document.addEventListener("click", (e) => {
    if (!menu.contains(e.target)) {
      menu.classList.remove("open");
      menuBtn.setAttribute("aria-expanded", "false");
      menuBtn.textContent = "☰";
    }
  });
</script>
<script src="/assets/theme.js" defer></script>
</body>
</html>
