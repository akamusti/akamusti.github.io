<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}akaMusti</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}akaMusti">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/img/pfp.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/img/pfp.jpg">
<link rel="stylesheet" href="/assets/themes.css">
<script>try{var _t=localStorage.getItem("akamusti-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<script>try{var _l=localStorage.getItem("akamusti-lang");if(_l==="en"||_l==="tr")document.documentElement.setAttribute("lang",_l);}catch(e){}</script>
<style>
  :root {
    --bg: #0b0d10;
    --fg: #eef2f3;
    --muted: #9aa4ad;
    --accent: #7df0ff;
    --accent2: #ff9d6b;
    --card: rgba(13, 17, 20, 0.62);
    --stroke: rgba(125, 240, 255, 0.22);
    --shade1: rgba(5, 8, 10, 0.45);
    --shade2: rgba(5, 8, 10, 0.78);
    --meta: #0b0d10;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--fg);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 100px 16px 32px;
    line-height: 1.6;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: url("/img/wallpaper.jpg") center / cover no-repeat fixed;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 50% 30%, transparent 30%, var(--shade1) 100%),
      linear-gradient(180deg, var(--shade1), var(--shade2));
  }

  /* topbar — fotodaki gibi: sol logo + sayfalar, sağ ikonlar + buton */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    border-bottom: 1px solid var(--stroke);
  }
  .topbar-inner {
    max-width: 1100px; margin: 0 auto; height: 60px; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .top-left { display: flex; align-items: center; gap: 28px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); flex: none; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; border: 1px solid var(--stroke); display: block; }
  .brand span { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
  .top-links { display: flex; align-items: center; gap: 22px; }
  .top-links a {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px; color: var(--muted); text-decoration: none; white-space: nowrap;
    transition: color 0.15s ease;
  }
  .top-links a:hover { color: var(--fg); }
  .top-links a[aria-current="page"] { color: var(--accent); }
  .topbar .theme { position: relative; top: auto; right: auto; z-index: auto; display: block; }
  .topbar .theme-btn {
    width: 36px; height: 36px; border-radius: 10px;
    border: 0; background: transparent; box-shadow: none;
    backdrop-filter: none; -webkit-backdrop-filter: none;
    color: var(--muted); font-size: 18px;
  }
  .topbar .theme-btn:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: transparent; box-shadow: none; transform: none; }
  .topbar .theme-panel { position: absolute; top: calc(100% + 10px); right: 0; margin-top: 0; z-index: 40; }
  .top-right { display: flex; align-items: center; gap: 2px; flex: none; }
  .topbar .lang { position: relative; display: block; }
  .lang-btn {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  }
  .icon-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; text-decoration: none;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .icon-btn:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .icon-btn svg { width: 18px; height: 18px; display: block; }
  .cta {
    margin-left: 10px; flex: none;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
    padding: 9px 18px; border-radius: 6px;
    background: var(--accent); color: #0b0d10; text-decoration: none;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .cta:hover { filter: brightness(1.08); transform: translateY(-1px); }

  .shell {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 40px color-mix(in srgb, var(--accent) 7%, transparent), inset 0 1px 0 rgba(255,255,255,0.08);
    padding: 32px 32px 28px;
    position: relative;
    overflow: hidden;
  }
  .shell::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 70%, transparent), transparent);
  }

  header { text-align: center; margin-bottom: 8px; }

  .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 30%, transparent);
    margin-bottom: 8px;
  }

  .titles h1 { font-size: 22px; font-weight: 700; }
  .titles h1 a { color: var(--fg); text-decoration: none; }
  .titles h1 a:hover { color: var(--accent); }

  main { width: 100%; margin-top: 12px; }

  .back {
    display: inline-block;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 12px;
  }
  .back:hover { color: var(--accent); }

  .page-title { font-size: 30px; font-weight: 700; margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 6px; }

  .rule {
    height: 1px; margin: 16px 0;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 35%, transparent), transparent);
  }

  .post-box {
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.045);
    text-decoration: none;
    color: var(--fg);
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .post-box:hover {
    transform: translateY(-1px);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
    box-shadow: 0 6px 24px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .pb-title { flex: 1; font-size: 16px; font-weight: 600; }
  .pb-date {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  .blog-empty { padding: 13px 0; font-size: 15px; color: var(--muted); }

  .post-title { font-size: 27px; font-weight: 700; line-height: 1.25; margin-bottom: 8px; }
  .post-meta {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.08em;
    color: var(--muted); margin-bottom: 20px;
  }
  .post-content { font-size: 16px; line-height: 1.75; }
  .post-content p { margin-bottom: 1.25em; }
  .post-content h2 { font-size: 21px; margin: 1.5em 0 0.6em; }
  .post-content h3 { font-size: 17px; margin: 1.5em 0 0.5em; }
  .post-content a { color: var(--accent); }
  .post-content ul, .post-content ol { margin: 0 0 1.25em 1.25em; }
  .post-content li { margin-bottom: 0.4em; }
  .post-content blockquote {
    border-left: 2px solid color-mix(in srgb, var(--accent) 40%, transparent);
    padding-left: 16px; margin: 0 0 1.25em; color: var(--muted);
  }
  .post-content code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.85em;
    background: rgba(255, 255, 255, 0.06);
    padding: 2px 6px; border-radius: 6px;
  }
  .post-content pre {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 12px; padding: 16px;
    overflow-x: auto; margin-bottom: 1.25em;
  }
  .post-content pre code { background: none; padding: 0; }
  .post-content img { max-width: 100%; border-radius: 12px; }
  .post-content hr {
    border: none; border-top: 1px solid rgba(255,255,255,0.12);
    margin: 2em auto; width: 120px;
  }

  footer {
    margin-top: 24px;
    text-align: center;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  footer .sep { margin: 0 8px; opacity: 0.5; }

  @media (max-width: 640px) {
    .topbar-inner { padding: 0 12px; gap: 10px; }
    .top-left { gap: 16px; }
    .brand span { display: none; }
    .top-links { gap: 14px; }
    .top-links a { font-size: 13px; }
    .cta { padding: 8px 12px; font-size: 12px; }
  }
  @media (max-width: 480px) {
    body { padding: 92px 12px 24px; }
    .shell { padding: 24px 20px 22px; }
    .page-title { font-size: 25px; }
    .post-title { font-size: 23px; }
    .post-content { font-size: 15px; }
    .post-box { padding: 12px 14px; }
  }
</style>
</head>
<body>
<div class="bg"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="top-left">
      <a class="brand" href="/"><img src="/img/pfp.jpg" alt="akaMusti"><span>akaMusti</span></a>
      <nav class="top-links">
        <a href="/blog/"{% if page.url contains '/blog' %} aria-current="page"{% endif %} data-i18n="nav.journal">günlük</a>
        <a href="/defter/"{% if page.url contains '/defter' %} aria-current="page"{% endif %} data-i18n="nav.guestbook">defter</a>
        <a href="/projeler/"{% if page.url contains '/projeler' %} aria-current="page"{% endif %} data-i18n="nav.projects">projeler</a>
      </nav>
    </div>
    <div class="top-right">
      <div class="theme" id="theme">
        <button class="theme-btn" id="themeBtn" aria-label="tema değiştir" aria-expanded="false" title="tema değiştir (T)">◑</button>
        <div class="theme-panel" role="menu" aria-label="temalar"></div>
      </div>
      <div class="lang" id="lang">
        <button class="icon-btn lang-btn" id="langBtn" aria-label="language" aria-expanded="false" title="TR/EN">EN</button>
        <div class="lang-panel" role="menu" aria-label="language"></div>
      </div>
      <a class="icon-btn" href="/blog/feed.xml" title="rss" aria-label="rss">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4.4v3c7 0 12.6 5.6 12.6 12.6h3C19.6 11.7 12.3 4.4 4 4.4zm0 6v3c3.7 0 6.6 2.9 6.6 6.6h3c0-5.3-4.3-9.6-9.6-9.6zM6.2 15.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z"/></svg>
      </a>
      <a class="icon-btn" href="https://github.com/akamusti" target="_blank" rel="noopener" title="github" aria-label="github">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.7 5.38-5.26 5.67.41.35.77 1.05.77 2.12v3.14c0 .3.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
      </a>
      <a class="cta" href="/projeler/" data-i18n="cta.projects">projelerim</a>
    </div>
  </div>
</header>

<div class="shell">
  <header>
    <img class="avatar" src="/img/pfp.jpg" alt="akaMusti">
    <div class="titles">
      <h1><a href="/">akaMusti</a></h1>
    </div>
  </header>

  <main>
{{ content }}
  </main>

  <footer><span>&copy; 2026 akaMusti</span><span class="sep">·</span><a href="/gizlilik/" data-i18n="footer.privacy">gizlilik</a></footer>
</div>

<script src="/assets/theme.js" defer></script>
<script src="/assets/lang.js" defer></script>
</body>
</html>
