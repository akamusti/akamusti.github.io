<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}akaMusti</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}akaMusti">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/avatar.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="%230b0d10"/><rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="%237ee787" stroke-opacity="0.35" stroke-width="3"/><text x="50" y="69" font-size="54" font-family="monospace" font-weight="bold" text-anchor="middle" fill="%237ee787">i</text></svg>'>
<style>
  :root {
    --bg: #0b0d10;
    --fg: #e2e5e8;
    --muted: #8b93a1;
    --dim: #464c56;
    --divider: rgba(255, 255, 255, 0.07);
    --accent: #7ee787;
    --radius: 14px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  ::selection {
    background: rgba(126, 231, 135, 0.25);
    color: var(--fg);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    color: var(--fg);
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 85% 45% at 50% -18%, rgba(126, 231, 135, 0.07), transparent),
      radial-gradient(ellipse 55% 35% at 85% 110%, rgba(126, 231, 135, 0.04), transparent);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.5;
  }

  .shell {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 72px 24px 40px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .avatar {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(126, 231, 135, 0.35);
  }

  .titles h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .titles h1 a {
    color: inherit;
    text-decoration: none;
  }

  main {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .section-label {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
    text-align: center;
    margin: 8px 0 0;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 18px;
    border: 1px solid var(--divider);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.02);
    text-decoration: none;
    color: var(--fg);
    transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
  }

  .link:hover {
    border-color: rgba(126, 231, 135, 0.4);
    background: rgba(255, 255, 255, 0.045);
    transform: translateY(-1px);
  }

  .link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .link svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--muted);
    transition: color 0.15s ease;
  }

  .link svg.line {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .link:hover svg { color: var(--accent); }

  .link .label {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
  }

  .link .tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 3px 8px;
    border: 1px solid rgba(126, 231, 135, 0.25);
    border-radius: 999px;
    white-space: nowrap;
  }

  .link .arrow {
    font-size: 14px;
    color: var(--dim);
    transition: transform 0.15s ease, color 0.15s ease;
  }

  .link:hover .arrow {
    transform: translate(2px, -2px);
    color: var(--accent);
  }

  .blog-empty {
    text-align: center;
    padding: 13px 0;
    font-size: 14px;
    color: var(--muted);
  }

  .back {
    align-self: flex-start;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 4px;
    transition: color 0.15s ease;
  }

  .back:hover { color: var(--accent); }

  .post-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    text-align: center;
    margin-bottom: 8px;
  }

  .post-meta {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--dim);
    text-align: center;
    margin-bottom: 28px;
  }

  .post-content {
    font-size: 16px;
    line-height: 1.75;
    color: var(--fg);
  }

  .post-content p { margin-bottom: 1.25em; }

  .post-content h2 {
    font-size: 21px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 1.75em 0 0.6em;
  }

  .post-content h3 {
    font-size: 17px;
    font-weight: 650;
    margin: 1.5em 0 0.5em;
  }

  .post-content a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: rgba(126, 231, 135, 0.4);
    text-underline-offset: 3px;
  }

  .post-content a:hover { text-decoration-color: var(--accent); }

  .post-content ul, .post-content ol {
    margin: 0 0 1.25em 1.25em;
  }

  .post-content li { margin-bottom: 0.4em; }

  .post-content blockquote {
    border-left: 2px solid rgba(126, 231, 135, 0.4);
    padding-left: 16px;
    margin: 0 0 1.25em;
    color: var(--muted);
  }

  .post-content code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.85em;
    background: rgba(255, 255, 255, 0.06);
    padding: 2px 6px;
    border-radius: 6px;
  }

  .post-content pre {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--divider);
    border-radius: var(--radius);
    padding: 16px;
    overflow-x: auto;
    margin-bottom: 1.25em;
  }

  .post-content pre code {
    background: none;
    padding: 0;
  }

  .post-content img {
    max-width: 100%;
    border-radius: var(--radius);
  }

  .post-content hr {
    border: none;
    border-top: 1px solid var(--divider);
    margin: 2em 0;
  }

  footer {
    margin-top: 28px;
    text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    color: var(--dim);
  }

  @media (max-width: 480px) {
    .shell { padding-top: 56px; }
    .titles h1 { font-size: 26px; }
    .avatar { width: 60px; height: 60px; }
    .post-title { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <img class="avatar" src="/avatar.jpg" alt="akaMusti profile photo">
    <div class="titles">
      <h1><a href="/">akaMusti</a></h1>
    </div>
  </header>

  <main>
{{ content }}
  </main>

  <footer>&copy; 2026 akaMusti</footer>
</div>
</body>
</html>
