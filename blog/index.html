---
layout: default
title: blog
description: akaMusti — blog yazıları.
---
<a class="back" href="/">&larr; ana sayfa</a>

<section>
  <p class="section-label">blog</p>
  <div class="links">
    {% for post in site.posts %}
    <a class="link" href="{{ post.url }}">
      <svg class="line" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span class="label">{{ post.title }}</span>
      <span class="tag">{{ post.date | date: "%d.%m.%Y" }}</span>
      <span class="arrow">&#8599;</span>
    </a>
    {% else %}
    <a class="link" href="/">
      <svg class="line" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span class="label">henüz yazı yok</span>
      <span class="tag">blog</span>
      <span class="arrow">&#8599;</span>
    </a>
    {% endfor %}
  </div>
</section>
