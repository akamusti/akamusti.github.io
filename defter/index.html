<script>
  // Utterances tema yönetimi ve canlı tema senkronizasyonu
  (function() {
    function getUtterancesTheme(siteTheme) {
      return siteTheme === "flexoki-light" ? "github-light" : "github-dark";
    }

    try {
      var curTheme = document.documentElement.getAttribute("data-theme");
      var uTheme = getUtterancesTheme(curTheme);
      var utScript = document.getElementById("utterances");
      if (utScript) utScript.setAttribute("theme", uTheme);
    } catch (e) {}

    // Canlı tema değiştiğinde utterances iframe'ine mesaj ilet
    document.addEventListener("akamusti:theme", function(e) {
      var iframe = document.querySelector(".utterances-frame");
      if (!iframe) return;
      var newUTheme = getUtterancesTheme(e.detail.theme);
      iframe.contentWindow.postMessage({
        type: "set-theme",
        theme: newUTheme
      }, "https://utteranc.es");
    });
  })();
</script>
